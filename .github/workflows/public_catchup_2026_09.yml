name: Public Data Catch-up 2026-09

on:
  pull_request:
    paths:
      - 'docs/CATCHUP_TRIGGER*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-data-catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-public.txt
      - run: pip install -r requirements-public.txt

      - name: Catch up September daily TW golden contract
        env:
          PUBLIC_DATA_ROOT: data
        run: python scripts/build_daily_tw_compat.py

      - name: Catch up monthly revenue
        run: python scripts/monthly_job.py

      - name: Refresh latest TDCC week
        run: python scripts/weekly_job.py

      - name: Refresh TW indices
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python scripts/daily_tw_indices_job.py

      - name: Refresh latest quarterly financials
        env:
          QUARTERLY_LATEST_ONLY: "1"
          QUARTERLY_RETRIES: "4"
        run: python scripts/quarterly_job.py

      - name: Refresh FX history
        run: python scripts/fetch_exchange_rate.py

      - name: Refresh corporate actions
        run: python scripts/01_CorePipeline/fetch_corporate_actions_daily.py

      - name: Refresh ETF acquisition and outputs
        env:
          PYTHONPATH: scripts/etf
        run: python scripts/etf/etf_pipeline.py

      - name: Validate all public domains dynamically
        run: |
          python - <<'PY'
          import json, pathlib, gzip
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          root=pathlib.Path("data")
          idx=json.loads((root/"index.json").read_text())
          daily=sorted(p.stem for p in (root/"daily/tw").glob("????-??-??.json"))
          indices=sorted(p.stem for p in (root/"daily/tw_indices").glob("????-??-??.json"))
          if not daily: raise SystemExit("no daily TW data")
          expected_latest=daily[-1]
          if idx.get("latest_daily_tw") != expected_latest: raise SystemExit("daily index cursor mismatch")
          if not indices or indices[-1] != expected_latest: raise SystemExit(f"TW indices lag daily TW: {indices[-1] if indices else None} != {expected_latest}")
          with gzip.open(root/"meta/fast_history_tw.csv.gz","rt") as f: next(f)
          # Periodic datasets are validated against their own materialized positions,
          # never against hard-coded calendar dates.
          weeks=idx.get("available_weeks", [])
          quarters=idx.get("available_quarters", [])
          if weeks and idx.get("latest_weekly") != max(weeks): raise SystemExit("weekly cursor mismatch")
          now=datetime.now(ZoneInfo("Asia/Taipei"))
          first=now.replace(day=1)
          prev=first-timedelta(days=1)
          expected_revenue=prev.strftime("%Y-%m")
          if idx.get("latest_monthly_revenue") != expected_revenue: raise SystemExit(f"monthly revenue incomplete: {idx.get('latest_monthly_revenue')} != {expected_revenue}")
          if quarters and idx.get("latest_quarterly") != max(quarters): raise SystemExit("quarterly cursor mismatch")
          fx_payload=json.loads((root/"meta/exchange_rate_history.json").read_text())
          fx_dates=sorted(row.get("date") for row in fx_payload.get("data", []) if row.get("date"))
          if not fx_dates: raise SystemExit("FX history empty")
          expected_fx=fx_dates[-1]
          if idx.get("latest_exchange_rate") != expected_fx: raise SystemExit(f"FX cursor mismatch: {idx.get('latest_exchange_rate')} != materialized {expected_fx}")
          today=now.strftime("%Y-%m-%d")
          if idx.get("latest_action") != today: raise SystemExit(f"corporate actions cursor stale: {idx.get('latest_action')} != {today}")
          etf=root/"quant/etf/outputs/latest_snapshot.json"
          if not etf.exists(): raise SystemExit("ETF snapshot missing")
          payload=json.loads(etf.read_text())
          if not payload: raise SystemExit("ETF snapshot empty")
          if len(payload) < 20: raise SystemExit(f"ETF snapshot suspiciously small: {len(payload)}")
          print(json.dumps({
            "latest_daily_tw": idx.get("latest_daily_tw"),
            "latest_daily_tw_indices": idx.get("latest_daily_tw_indices"),
            "latest_monthly_revenue": idx.get("latest_monthly_revenue"),
            "latest_weekly": idx.get("latest_weekly"),
            "latest_quarterly": idx.get("latest_quarterly"),
            "latest_exchange_rate": idx.get("latest_exchange_rate"),
            "latest_action": idx.get("latest_action"),
          }, ensure_ascii=False, indent=2))
          print("ALL PUBLIC DOMAIN POSITION VALIDATION PASS")
          PY

      - name: Publish recovered public data without rebase races
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/tw data/daily/tw_indices data/meta/fast_history_tw.csv.gz data/meta/exchange_rate_history.json data/meta/etf_universe.json data/meta/actions data/monthly data/weekly data/quarterly data/raw_csvs/quarterly data/quant/etf/outputs data/index.json
          git diff --cached --quiet && exit 0
          git commit -m "data: catch up September all public domains"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "main advanced; retrying from latest main without rebasing PR merge commits"
            git fetch origin main
            git reset --soft origin/main
            git commit -m "data: catch up September all public domains"
            sleep $((attempt*5))
          done
          exit 1
