name: Public Data Factory - Reference
on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * 6'
permissions:
  contents: write
concurrency:
  group: public-data-factory
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-public.txt
      - run: pip install -r requirements-public.txt
      - name: Sync reference domains
        run: |
          python scripts/public_sync.py calendar
          python scripts/public_sync.py tdcc
          python scripts/public_sync.py etf
          python scripts/public_sync.py corporate_actions
      - name: Commit public factory data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/factory
          git diff --cached --quiet && exit 0
          git commit -m "data: update public factory reference data"
          git pull --rebase origin main
          git push origin HEAD:main
