name: Public Data Factory - Daily
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: public-data-factory
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-public.txt
      - run: pip install -r requirements-public.txt
      - name: Sync public market domains
        run: |
          D="$(TZ=Asia/Taipei date +%F)"
          python scripts/public_sync.py market --date "$D"
          python scripts/public_sync.py institutional --date "$D"
          python scripts/public_sync.py margin --date "$D"
          python scripts/public_sync.py financial
          python scripts/public_sync.py revenue
          python scripts/public_sync.py fx
      - name: Commit public factory data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/factory
          git diff --cached --quiet && exit 0
          git commit -m "data: update public factory"
          git pull --rebase origin main
          git push origin HEAD:main
