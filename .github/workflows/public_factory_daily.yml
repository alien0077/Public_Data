name: Public Data Factory - Daily
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: public-data-factory
  cancel-in-progress: false
jobs:
  sync:
    runs-on: [self-hosted, Linux, X64, acer-worker, public-data, n100]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-public.txt
      - run: pip install -r requirements-public.txt
      - name: Pipeline reliability regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_factory_reliability.py
      - name: Sync public market domains
        id: sync
        run: python scripts/run_daily_factory.py
      - name: Commit public factory data
        if: ${{ always() && steps.sync.outcome != 'skipped' }}
        run: |
          test -f data/factory/health/daily.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/factory
          git diff --cached --quiet && exit 0
          git commit -m "data: update public factory"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
